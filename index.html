<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vánoční paměťová výzva</title>
<style>
:root{color-scheme:dark;--gold:#facc15;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans',sans-serif;color:#fff;background:linear-gradient(135deg,#450a0a,#064e3b 55%,#172554);padding:18px}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 15px;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}
header,.bar,.teacher,.board{width:min(1100px,100%);margin:0 auto 16px;background:#ffffff18;border:1px solid #ffffff25;border-radius:18px;padding:15px;backdrop-filter:blur(6px)}header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,30px);color:var(--gold);margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap}.yellow{background:var(--gold);color:#241600}.green{background:#047857;color:white}.amber{background:#b45309;color:white}.muted{background:#475569;color:white}
main{width:min(1100px,100%);margin:auto}.levels{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.level-btn{background:#ffffff25;color:white}.level-btn.active{background:var(--gold);color:#201600}.level-btn.locked{opacity:.45}
.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stat{font-weight:700}.stat strong{color:var(--gold)}#status{flex:1;min-width:220px;text-align:center;font-weight:700;color:var(--gold)}
#targetBox{display:none;text-align:center;margin:12px auto 16px;background:#facc1522;border:1px solid #facc1580;border-radius:16px;padding:12px;width:max-content;max-width:100%}#targetImg{display:block;width:90px;height:90px;object-fit:contain;background:#ffffff18;border-radius:12px;margin:6px auto 0}
#board{display:grid;gap:10px;max-width:900px;margin:0 auto;background:#0003;border:1px solid #ffffff25;border-radius:22px;padding:14px;min-height:220px}.card{aspect-ratio:1/1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:5px;background:#ffffff20;border:2px solid #ffffff50;border-radius:14px;overflow:hidden}.card img{width:88%;height:88%;object-fit:contain}.card.back{background:linear-gradient(145deg,#991b1b,#065f46);border:3px solid #facc15}.card.back:after{content:'🎄';font-size:clamp(22px,4vw,40px)}.card.good{background:#166534;border-color:#86efac}.card.bad{background:#991b1b;border:4px solid #fca5a5}.card:disabled{cursor:default}
.teacher{display:none}.teacher.show{display:block}.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:end}.settings label{display:flex;flex-direction:column;gap:6px;font-size:14px}.settings input,.settings select{padding:8px;border-radius:8px;background:#052e24;color:white;border:1px solid #4ade80}
#gallery{display:none;position:fixed;inset:0;background:#000d;z-index:5;padding:20px;overflow:auto}#gallery.show{display:block}.gallery-inner{max-width:1000px;margin:auto;background:#064e3b;border-radius:18px;padding:18px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.gallery-grid img{width:100%;height:90px;object-fit:contain}.gallery-item{text-align:center;background:#ffffff15;border-radius:10px;padding:8px;font-size:13px}
footer{text-align:center;color:#cbd5e1;font-size:12px;margin:18px}
@media(max-width:600px){body{padding:9px}.bar{padding:11px}.card{border-radius:9px;padding:2px}#board{gap:6px;padding:8px}.tools button{padding:8px 10px}}
</style></head><body>
<header><h1>🎄 Vánoční paměťová výzva</h1><div class="tools"><button id="musicBtn" class="muted">🔇 Hudba: VYP</button><label style="display:flex;align-items:center;gap:5px">🔈<input id="volume" type="range" min="0" max="1" step=".05" value=".35" aria-label="Hlasitost"></label><button id="galleryBtn" class="amber">🎁 Obrázky (30)</button><button id="teacherBtn" class="green">👩‍🏫 Pro učitele</button></div></header>
<main>
<section id="teacher" class="teacher"><h3>⚙️ Nastavení pro učitele</h3><div class="settings"><label>Čas na prohlédnutí (s)<input id="previewSeconds" type="number" min="2" max="20" value="5"></label><label>Časovač hledání<select id="timerMode"><option value="on">Zapnutý</option><option value="off">Vypnutý</option></select></label><label>Otevřít úroveň<select id="levelJump"><option value="1">1. úroveň</option><option value="2">2. úroveň</option><option value="3">3. úroveň</option><option value="4">4. úroveň</option><option value="5">5. úroveň</option><option value="6">6. úroveň</option></select></label></div></section>
<div id="levels" class="levels"></div>
<section class="bar"><div class="stat">Celkem: <strong id="totalScore">0</strong> bodů</div><div class="stat">Úroveň: <strong id="levelScore">0 / 10</strong></div><div class="stat">Úkol: <strong id="round">0 / 10</strong></div><div id="status" role="status">Stiskni START a zapamatuj si rozmístění karet.</div><div class="stat">Čas: <strong id="time">--</strong></div><button id="start" class="yellow">START</button></section>
<div id="targetBox"><div>Najdi tento obrázek:</div><img id="targetImg" alt="Hledaný obrázek"></div>
<div id="board" aria-label="Herní kartičky"><p style="grid-column:1/-1;text-align:center">Po stisknutí START se zobrazí kartičky.</p></div>
</main><footer>Vánoční paměťová výzva • 30 vánočních obrázků</footer>
<div id="gallery"><div class="gallery-inner"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Galerie vánočních obrázků</h2><button id="closeGallery" class="yellow">Zavřít</button></div><div id="galleryGrid" class="gallery-grid"></div></div></div>
<script>
'use strict';
const images=[
['Stromeček','01_stromecek.png'],['Sněhulák','02_snehulak.png'],['Santa','03_santa.png'],['Sob','04_sob.png'],['Perníková chaloupka','05_pernikova_chaloupka.png'],['Perníček','06_pernicek.png'],['Zvonek','07_zvonek.png'],['Baňka','08_banka.png'],['Dárek','09_darek.png'],['Svíce','10_svice.png'],['Hvězda','11_hvezda.png'],['Anděl','12_andel.png'],['Čert','13_cert.png'],['Vánoční ponožka','14_vanocni_ponozka.png'],['Cukrová hůlka','15_cukrova_hulka.png'],['Kapr','16_kapr.png'],['Kometa','17_kometa.png'],['Vločka','18_vlocka.png'],['Rukavice','19_rukavice.png'],['Sáně','20_sanky.png'],['Medvídek','21_medvidek.png'],['Věnec','22_venec.png'],['Rolničky','23_rolnicky.png'],['Svícen','24_svicen.png'],['Vánoční hvězda','25_vanocni_hvezda.png'],['Vláček','26_vlacek.png'],['Zvoneček','27_zvonecek.png'],['Lízátko','28_lizatko.png'],['Betlém','29_betlem.png'],['Skřítek','30_skritek.png']
].map((x,i)=>({id:i+1,name:x[0],src:x[1]}));
const configs=[null,{r:3,c:3,n:9},{r:3,c:4,n:12},{r:4,c:4,n:16},{r:4,c:5,n:20},{r:5,c:5,n:25},{r:5,c:6,n:30}];
let level=1,total=0,points=0,round=0,cards=[],queue=[],target=null,state='idle',timer=null,timeLeft=0,found=new Set(),audio=null,music=false,musicTimer=null,noteIndex=0;
const $=id=>document.getElementById(id);
const melody=[659,659,659,659,659,659,659,784,523,587,659,698,698,698,698,698,659,659,659,659,587,587,659,587,784];
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function setStatus(t){$('status').textContent=t}
function scoreboard(){$('totalScore').textContent=total;$('levelScore').textContent=points+' / 10';$('round').textContent=round+' / 10'}
function renderLevels(){const box=$('levels');box.innerHTML='';for(let i=1;i<=6;i++){let b=document.createElement('button');b.textContent=`${i}. úroveň (${configs[i].r}×${configs[i].c})`;b.className='level-btn'+(i===level?' active':'')+(i>level?' locked':'');b.disabled=i>level;b.addEventListener('click',()=>selectLevel(i));box.appendChild(b)}}
function selectLevel(n){if(n>level)return;level=n;points=0;round=0;found.clear();stopTimer();state='idle';$('levelJump').value=String(level);$('targetBox').style.display='none';$('start').textContent='START';$('start').disabled=false;$('start').onclick=null;setStatus(`Úroveň ${level} připravena. Získej 10 bodů.`);$('time').textContent='--';$('board').innerHTML='<p style="grid-column:1/-1;text-align:center">Stiskni START a začni.</p>';renderLevels();scoreboard()}
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){stopTimer();if(level===1&&total===0){};points=0;round=0;found.clear();cards=shuffle(images).slice(0,configs[level].n);let q=shuffle(cards);queue=q.slice(0,10);while(queue.length<10)queue.push(cards[Math.floor(Math.random()*cards.length)]);queue=shuffle(queue);scoreboard();$('start').disabled=true;$('start').textContent='Hra běží';state='preview';renderBoard(true);let sec=Math.max(2,Math.min(20,Number($('previewSeconds').value)||5));timeLeft=sec;$('time').textContent=sec;setStatus('Zapamatuj si, kde jsou obrázky!');timer=setInterval(()=>{timeLeft--;$('time').textContent=timeLeft;if(timeLeft<=0){stopTimer();ask()}},1000)}
function renderBoard(showAll=false,revealIndex=-1){const b=$('board'),cfg=configs[level];b.style.gridTemplateColumns=`repeat(${cfg.c},minmax(0,1fr))`;b.innerHTML='';cards.forEach((card,i)=>{let btn=document.createElement('button');btn.className='card';btn.type='button';btn.setAttribute('aria-label',`Kartička ${i+1}`);let visible=showAll||found.has(card.id)||i===revealIndex;if(visible){let im=document.createElement('img');im.src=card.src;im.alt=card.name;btn.appendChild(im)}else btn.classList.add('back');if(found.has(card.id))btn.classList.add('good');if(i===revealIndex)btn.classList.add('bad');btn.disabled=showAll||(found.has(card.id)&&(!target||card.id!==target.id))||state==='feedback';btn.addEventListener('click',()=>choose(i));b.appendChild(btn)})}
function ask(){state='playing';$('targetBox').style.display='block';target=queue.shift();round++;$('targetImg').src=target.src;$('targetImg').alt=target.name;setStatus(`Najdi obrázek. Úkol ${round} z 10.`);scoreboard();startAnswerTimer();renderBoard()}
function startAnswerTimer(){stopTimer();if($('timerMode').value==='off'){$('time').textContent='∞';return}timeLeft=12+level*3;$('time').textContent=timeLeft;timer=setInterval(()=>{timeLeft--;$('time').textContent=timeLeft;if(timeLeft<=0){stopTimer();setStatus('Čas vypršel. Zkus hledat znovu.');setTimeout(()=>{if(state==='playing'){setStatus('Najdi hledaný obrázek.');startAnswerTimer()}},1000)}},1000)}
function choose(i){if(state!=='playing')return;let card=cards[i];if(card.id===target.id){stopTimer();state='playing';found.add(card.id);points++;total++;scoreboard();renderBoard();setStatus('Správně! +1 bod. 🎉');if(points>=10){setTimeout(finishLevel,800)}else{setTimeout(()=>{if(state==='playing')ask()},800)}}else{stopTimer();state='feedback';renderBoard(false,i);setStatus('To není ono. Prohlédni si kartu a potom pokračuj.');let b=document.createElement('button');b.textContent='Pokračovat';b.className='yellow';b.style.margin='12px auto';b.style.display='block';b.addEventListener('click',()=>{state='playing';b.remove();window.continueButton=null;renderBoard();setStatus('Zkus najít hledaný obrázek.');startAnswerTimer()});$('board').after(b);window.continueButton=b}}
function finishLevel(){stopTimer();state='complete';$('targetBox').style.display='none';$('time').textContent='--';if(window.continueButton){window.continueButton.remove();window.continueButton=null}if(level<6){setStatus(`Skvělé! Máš 10 bodů. Dokončil/a jsi ${level}. úroveň!`);$('start').disabled=false;$('start').textContent='DALŠÍ ÚROVEŇ';}else{setStatus('Gratulujeme! Dokončil/a jsi všech 6 úrovní! 🏆');$('start').disabled=false;$('start').textContent='HRÁT ZNOVU';}}
function toggleTeacher(){$('teacher').classList.toggle('show')}
function showGallery(){const g=$('galleryGrid');g.innerHTML='';images.forEach(x=>{let d=document.createElement('div');d.className='gallery-item';let im=document.createElement('img');im.src=x.src;im.alt=x.name;let t=document.createElement('div');t.textContent=x.name;d.append(im,t);g.append(d)});$('gallery').classList.add('show')}
function musicLoop(){if(!music||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=melody[noteIndex];g.gain.value=Number($('volume').value)*.09;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22);noteIndex=(noteIndex+1)%melody.length;musicTimer=setTimeout(musicLoop,300)}
function toggleMusic(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();music=!music;$('musicBtn').textContent=music?'🔊 Hudba: ZAP':'🔇 Hudba: VYP';if(music)musicLoop();else clearTimeout(musicTimer)}catch(e){setStatus('Hudbu tento prohlížeč nepodporuje; hru lze hrát bez ní.')}}
$('start').addEventListener('click',()=>{if(state==='complete'){if(level<6){level++;selectLevel(level);start()}else{total=0;selectLevel(1);start()}}else{start()}});$('teacherBtn').addEventListener('click',toggleTeacher);$('galleryBtn').addEventListener('click',showGallery);$('closeGallery').addEventListener('click',()=>$('gallery').classList.remove('show'));$('musicBtn').addEventListener('click',toggleMusic);$('levelJump').addEventListener('change',e=>{let n=Number(e.target.value);if(n<=level)selectLevel(n);else{level=n;points=0;round=0;found.clear();stopTimer();state='idle';$('targetBox').style.display='none';$('start').disabled=false;$('start').textContent='START';setStatus(`Učitelsky otevřena ${level}. úroveň.`);$('board').innerHTML='';renderLevels();scoreboard()}});
renderLevels();scoreboard();
</script></body></html>
